
spring:
  application:
    name: ecommerce-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ecomuser}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: EcommerceHikariPool
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:

      ddl-auto: update
    open-in-view: false          # force explicit fetching in the service layer
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
      thread-name-prefix: ecom-async-

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ---------------------------------------------------------------------------
#  Application-specific settings (bound to com.ecommerce.config.*Properties)
# ---------------------------------------------------------------------------
app:
  jwt:
    # REQUIRED. Base64 or plain text, minimum 32 characters for HS256.
    secret: ${APP_JWT_SECRET}
    # Access token lifetime in milliseconds (default 24 hours).
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
    issuer: ecommerce-api

  cors:
    # Comma-separated list of allowed frontend origins.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

  admin:
    # Seeded on first run only. Change the password after first login.
    email: ${ADMIN_EMAIL:admin@ecommerce.local}
    password: ${ADMIN_PASSWORD}
    full-name: ${ADMIN_FULL_NAME:System Administrator}
    phone-number: ${ADMIN_PHONE:+910000000000}

  whatsapp:
    # When false (or when credentials are absent), notifications are logged and
    # stored with status SKIPPED instead of being sent. The app still works.
    enabled: ${WHATSAPP_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    # Twilio sandbox number, e.g. whatsapp:+14155238886
    from-number: ${TWILIO_WHATSAPP_FROM:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.ecommerce: INFO
    org.springframework.security: INFO
